<!DOCTYPE html>
<html>
<head>
    <title>Space Invaders</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }
        
        #gameCanvas {
            border: 2px solid #33ff33;
            background: #000;
        }
        
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #33ff33;
            font-size: 20px;
        }
        
        #level {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #33ff33;
            font-size: 20px;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 48px;
            display: none;
        }
        
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #33ff33;
            text-align: center;
        }
        
        button {
            background: #33ff33;
            border: none;
            color: #000;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:hover {
            background: #66ff66;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="score">Score: 0</div>
        <div id="level">Level: 1</div>
        <div id="gameOver">Game Over!</div>
        <div id="startScreen">
            <h1>Space Invaders</h1>
            <p>Use ← → to move, SPACE to shoot</p>
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverElement = document.getElementById('gameOver');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');

        // Game state
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            width: 50,
            height: 30,
            speed: 5,
            color: '#33ff33'
        };

        // Bullets
        const bullets = [];
        const bulletSpeed = 7;
        const bulletWidth = 3;
        const bulletHeight = 15;

        // Enemies
        const enemies = [];
        const enemyWidth = 40;
        const enemyHeight = 30;
        const enemyPadding = 20;
        let enemyDirection = 1;
        let enemyStepDown = 30;

        // Sounds
        const shootSound = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU" + "0".repeat(100));
        const explosionSound = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU" + "0".repeat(100));

        // Controls
        const keys = {
            left: false,
            right: false,
            space: false
        };

        // Initialize enemies
        function initEnemies() {
            enemies.length = 0;
            const rows = 3 + Math.min(level - 1, 2);
            const cols = 6 + Math.min(level - 1, 4);
            
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    enemies.push({
                        x: j * (enemyWidth + enemyPadding) + 50,
                        y: i * (enemyHeight + enemyPadding) + 50,
                        width: enemyWidth,
                        height: enemyHeight,
                        speed: 2 + level * 0.5
                    });
                }
            }
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ') keys.space = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === ' ') keys.space = false;
        });

        startButton.addEventListener('click', startGame);

        function startGame() {
            gameRunning = true;
            score = 0;
            level = 1;
            lives = 3;
            startScreen.style.display = 'none';
            gameOverElement.style.display = 'none';
            initEnemies();
            gameLoop();
        }

        // Shooting mechanism
        function shoot() {
            if (keys.space) {
                bullets.push({
                    x: player.x + player.width / 2 - bulletWidth / 2,
                    y: player.y,
                    width: bulletWidth,
                    height: bulletHeight
                });
                shootSound.currentTime = 0;
                shootSound.play();
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update game state
        function update() {
            // Player movement
            if (keys.left && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys.right && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // Enemy movement
            let hitWall = false;
            enemies.forEach(enemy => {
                enemy.x += enemy.speed * enemyDirection;
                if (enemy.x <= 0 || enemy.x + enemyWidth >= canvas.width) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                enemyDirection *= -1;
                enemies.forEach(enemy => {
                    enemy.y += enemyStepDown;
                });
            }

            // Bullet movement and collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;

                // Remove bullets that are off screen
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check for collisions with enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (checkCollision(bullets[i], enemies[j])) {
                        explosionSound.currentTime = 0;
                        explosionSound.play();
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        scoreElement.textContent = `Score: ${score}`;
                        break;
                    }
                }
            }

            // Check for game over
            enemies.forEach(enemy => {
                if (enemy.y + enemy.height >= player.y) {
                    gameOver();
                }
            });

            // Check for level completion
            if (enemies.length === 0) {
                level++;
                levelElement.textContent = `Level: ${level}`;
                initEnemies();
            }
        }

        // Draw game objects
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw enemies
            ctx.fillStyle = '#ff3333';
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });

            // Draw bullets
            ctx.fillStyle = '#ffffff';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // Draw lives
            ctx.fillStyle = '#33ff33';
            for (let i = 0; i < lives; i++) {
                ctx.fillRect(10 + i * 30, canvas.height - 20, 20, 10);
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
            setTimeout(() => {
                startScreen.style.display = 'block';
            }, 2000);
        }

        // Game loop
        let lastShot = 0;
        function gameLoop() {
            if (!gameRunning) return;

            const now = Date.now();
            if (now - lastShot > 250 && keys.space) {
                shoot();
                lastShot = now;
            }

            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
